name: Docker Image CI and Push 'latest' to Aliyun ACR (Simplified)

on:
  push:
    branches: [ "dev" ]

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Aliyun Container Registry (ACR)
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.ACR_REGISTRY }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    # 移除了 docker/metadata-action 步骤

    - name: Build and push Docker image to ACR as 'latest'
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        # 直接在这里硬编码完整的镜像名和 'latest' 标签
        tags: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ secrets.ACR_REPOSITORY }}:latest
        # 注意：这样会丢失 metadata-action 自动生成的 labels
        # labels: ${{ steps.docker_meta.outputs.labels }} # 这一行需要移除或注释掉
